name: Desktop client candidates
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [mac, windows, both]
        default: mac
        description: Platforms to build. No platform is implied by another platform's version.
      mode:
        type: choice
        options: [build-only, signed, draft]
        default: build-only
        description: Unsigned build, signed candidate, or unpublished draft.
      preflight_only:
        type: boolean
        default: false
        description: Validate existing signing/profile access without building or changing Releases.
      create_session_profile:
        type: boolean
        default: false
        description: Explicitly allow creation of a missing profile in preflight only.
permissions:
  contents: read
concurrency:
  group: desktop-client-candidates
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - id: platforms
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            mac) matrix='{"include":[{"platform":"mac","os":"macos-15","arch":"arm64"}]}' ;;
            windows) matrix='{"include":[{"platform":"windows","os":"windows-2025","arch":"x64"}]}' ;;
            both) matrix='{"include":[{"platform":"mac","os":"macos-15","arch":"arm64"},{"platform":"windows","os":"windows-2025","arch":"x64"}]}' ;;
            *) exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  preflight:
    if: (inputs.mode != 'build-only' || inputs.preflight_only) && inputs.platform != 'windows'
    runs-on: macos-15
    environment: release
    timeout-minutes: 8
    env:
      CSC_NAME: ziming wang (947MAGH97Q)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Prepare existing signing identity
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/macos-signing.sh prepare
      - name: Resolve profile and signing access
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GOALLOOM_MAC_PROVISIONING_PROFILE_B64: ${{ secrets.GOALLOOM_MAC_PROVISIONING_PROFILE_B64 }}
          GOALLOOM_CREATE_MAC_PROFILE: ${{ inputs.create_session_profile && '1' || '0' }}
        run: |
          node .github/scripts/macos-profile.mjs
          bash .github/scripts/macos-signing.sh unlock
      - name: Remove temporary credentials
        if: always()
        run: bash .github/scripts/macos-signing.sh cleanup
  build:
    needs: [select, preflight]
    if: always() && needs.select.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') && !inputs.preflight_only
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build the exact public commit once
        env:
          GOALLOOM_BUILD_ENV: production
          GOALLOOM_SUPABASE_URL: https://keqprrgvcefqdwnxaafv.supabase.co
          GOALLOOM_SUPABASE_ANON_KEY: ${{ secrets.GOALLOOM_PRODUCTION_SUPABASE_ANON_KEY }}
        run: pnpm build:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          path: apps/desktop/out/
  package:
    needs: [select, build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 110
    env:
      CSC_NAME: ziming wang (947MAGH97Q)
      GOALLOOM_BUILD_ENV: production
      GOALLOOM_SUPABASE_URL: https://keqprrgvcefqdwnxaafv.supabase.co
      GOALLOOM_SUPABASE_ANON_KEY: ${{ secrets.GOALLOOM_PRODUCTION_SUPABASE_ANON_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-${{ matrix.platform }}
          path: apps/desktop/out/
      - name: Prepare macOS signing
        if: matrix.platform == 'mac' && inputs.mode != 'build-only'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/macos-signing.sh prepare
      - name: Validate the existing profile
        if: matrix.platform == 'mac' && inputs.mode != 'build-only'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GOALLOOM_MAC_PROVISIONING_PROFILE_B64: ${{ secrets.GOALLOOM_MAC_PROVISIONING_PROFILE_B64 }}
          GOALLOOM_CREATE_MAC_PROFILE: '0'
        run: node .github/scripts/macos-profile.mjs
      - name: Package unsigned macOS candidate
        if: matrix.platform == 'mac' && inputs.mode == 'build-only'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          unset CSC_NAME
          pnpm --filter @goalloom/desktop run package:mac:prepared
      - name: Package signed macOS candidate
        if: matrix.platform == 'mac' && inputs.mode != 'build-only'
        env:
          GOALLOOM_REQUIRE_NOTARIZATION: '1'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash .github/scripts/macos-signing.sh unlock
          unset CSC_IDENTITY_AUTO_DISCOVERY CSC_LINK CSC_KEY_PASSWORD
          pnpm --filter @goalloom/desktop run package:mac:prepared
          bash .github/scripts/macos-signing.sh notarize-dmg
          bash .github/scripts/macos-signing.sh verify
      - name: Signed synthetic Keychain acceptance
        if: matrix.platform == 'mac' && inputs.mode != 'build-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          swift .github/scripts/acceptance/macos-display.swift
          cd apps/desktop
          node ../../.github/scripts/acceptance/keychain-signed.mjs release/mac-arm64/Goalloom.app/Contents/MacOS/Goalloom
      - name: Package Windows candidate
        if: matrix.platform == 'windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @goalloom/desktop run package:win:prepared
      - name: Record final installer bytes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == mac ]]; then
            (cd apps/desktop && node scripts/build/package-report.mjs release latest darwin-arm64)
          fi
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          const root = 'apps/desktop/release'
          const names = (await readdir(root)).filter(name => /^Goalloom-.*\.(?:dmg|zip|exe|blockmap)$/.test(name) || /^latest(?:-mac)?\.yml$/.test(name)).sort()
          const rows = []
          for (const name of names) rows.push(`${createHash('sha256').update(await readFile(`${root}/${name}`)).digest('hex')}  ${name}`)
          await writeFile(`${root}/SHA256SUMS.txt`, rows.join('\n') + '\n')
          NODE
      - name: Remove temporary signing material
        if: always() && matrix.platform == 'mac' && inputs.mode != 'build-only'
        run: bash .github/scripts/macos-signing.sh cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/SHA256SUMS.txt
      - name: Upload finite public diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            apps/desktop/output/tests/notarization/*.json
            apps/desktop/output/tests/packages/*.json
            apps/desktop/output/tests/keychain-signed/report.json
  draft:
    needs: [select, package]
    if: inputs.mode == 'draft' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-*-${{ github.sha }}
          merge-multiple: true
          path: update-assets
      - name: Stage selected platforms in an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          GOALLOOM_RELEASE_PLATFORM: ${{ inputs.platform }}
        run: bash .github/scripts/draft-release.sh update-assets
