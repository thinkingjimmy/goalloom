name: Private desktop checks

# Manual only: the free plan has no Actions minutes for private macOS/Windows runners.
# Merges are gated by a local `pnpm verify` instead (see AGENTS.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            package: mac
          - os: windows-2025
            arch: x64
            package: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Record hosted VM scope
        run: node -e "console.log(JSON.stringify({scope:'GitHub-hosted VM; not physical-machine acceptance',image:process.env.ImageOS,imageVersion:process.env.ImageVersion,node:process.version,os:require('os').release(),arch:process.arch,cpu:require('os').cpus()[0].model})); if(process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run test:electron
      - run: pnpm run build
      - run: pnpm run test:ui
      - run: pnpm run test:history
      - run: pnpm run test:recovery
      - run: pnpm run package:${{ matrix.package }}
      - name: Packaged macOS smoke
        if: runner.os == 'macOS'
        run: |
          node tests/desktop/workspace.mjs release/mac-arm64/Goalloom.app/Contents/MacOS/Goalloom
          node tests/desktop/history.mjs release/mac-arm64/Goalloom.app/Contents/MacOS/Goalloom
          node tests/desktop/recovery.mjs release/mac-arm64/Goalloom.app/Contents/MacOS/Goalloom
      - name: Packaged Windows smoke
        if: runner.os == 'Windows'
        run: |
          node tests/desktop/workspace.mjs release/win-unpacked/Goalloom.exe
          node tests/desktop/history.mjs release/win-unpacked/Goalloom.exe
          node tests/desktop/recovery.mjs release/win-unpacked/Goalloom.exe
      - uses: actions/upload-artifact@v4
        with:
          name: private-preview-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 3
          path: |
            release/*.dmg
            release/*.exe
