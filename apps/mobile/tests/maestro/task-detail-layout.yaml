appId: app.goalloom.mobile
---
- launchApp
- tapOn:
    text: 完成 评审看板手势冲突方案, .*
- assertVisible:
    id: task-detail-main-card
- takeScreenshot: detail-top
- scrollUntilVisible:
    element:
      id: task-detail-goals
    direction: DOWN
- takeScreenshot: detail-goals
- scrollUntilVisible:
    element:
      id: task-detail-child-progress
    direction: DOWN
- assertVisible:
    id: task-detail-child-progress
    text: 0/2
- takeScreenshot: detail-children
