appId: app.goalloom.mobile
---
- launchApp
- tapOn:
    id: board-horizon-trigger
- tapOn:
    id: board-horizon-week
- tapOn:
    id: app-tab-settings
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 450
- scrollUntilVisible:
    element:
      text: 完成撒花.*
    direction: DOWN
- tapOn: 完成撒花.*
- tapOn:
    text: 本周
    selected: true
- assertVisible:
    text: 本周
    selected: false
- takeScreenshot: week-disabled
- tapOn: 关闭
- tapOn:
    id: app-tab-settings
- tapOn:
    id: app-tab-board
- tapOn:
    text: 完成 周三 10km 节奏跑, .*
- tapOn:
    text: ^完成 周三 10km 节奏跑$
    waitToSettleTimeoutMs: 0
- assertVisible:
    text: ^重新打开 周三 10km 节奏跑$
- takeScreenshot: disabled-completion
