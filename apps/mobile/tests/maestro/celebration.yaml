appId: app.goalloom.mobile
---
# A dedicated, demo-seeded iOS E2E build cycles confetti and the eight emoji shapes.
# Record video: decorative particles are intentionally absent from the accessibility tree.
- launchApp
- tapOn:
    id: board-horizon-trigger
- tapOn:
    id: board-horizon-week
- tapOn:
    text: 完成 周三 10km 节奏跑, .*
- assertVisible:
    id: task-detail-main-card
- repeat:
    times: 9
    commands:
      - tapOn:
          text: ^完成 周三 10km 节奏跑$
          waitToSettleTimeoutMs: 0
      - assertVisible:
          text: ^重新打开 周三 10km 节奏跑$
      - takeScreenshot: completion
      - tapOn:
          text: ^重新打开 周三 10km 节奏跑$
          waitToSettleTimeoutMs: 0
      - assertVisible:
          text: ^完成 周三 10km 节奏跑$
- takeScreenshot: completion-cleanup
