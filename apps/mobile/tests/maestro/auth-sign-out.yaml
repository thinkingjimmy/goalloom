appId: app.goalloom.mobile
---
- launchApp:
    clearState: true
- tapOn:
    id: account-google
- assertVisible:
    id: account-email
- tapOn:
    id: account-local
- tapOn:
    id: onboarding-next
- runFlow:
    when:
      visible: 'Speed up your typing.*'
    commands:
      - tapOn: Continue
- hideKeyboard
- tapOn: Run a marathon
- tapOn:
    id: onboarding-next
- tapOn:
    id: app-tab-settings
- tapOn:
    id: account-open
- tapOn:
    id: account-sign-out
- tapOn:
    text: Sign out
    childOf:
      containsChild: Cancel
- assertVisible:
    id: account-google
- stopApp
- launchApp
- assertVisible:
    id: app-tab-settings
- tapOn:
    id: app-tab-settings
- tapOn:
    id: account-open
- assertVisible:
    id: account-google
- assertNotVisible:
    id: account-email
- takeScreenshot: auth-signed-out
- tapOn:
    id: account-apple
- assertVisible:
    id: account-email
- takeScreenshot: auth-signed-in-again
