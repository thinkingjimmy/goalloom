appId: app.goalloom.mobile
---
# Use the actual UIKit preference, not a guessed simulator defaults key.
- launchApp:
    appId: com.apple.Preferences
    stopApp: false
- scrollUntilVisible:
    element:
      text: Accessibility
    direction: DOWN
- tapOn: Accessibility
- tapOn: Motion
- tapOn:
    # iPhone 17 at standard text: hit the switch, not the inert merged label.
    point: 84%,18%
- assertVisible:
    id: REDUCE_MOTION
    checked: true
- takeScreenshot: system-reduce-motion-enabled
- runFlow: celebration.yaml
- launchApp:
    appId: com.apple.Preferences
    stopApp: false
- tapOn:
    point: 84%,18%
- assertVisible:
    id: REDUCE_MOTION
    checked: false
- launchApp:
    stopApp: false
- takeScreenshot: no-replay-after-motion-restored
